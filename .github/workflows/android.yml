name: Manual Build Fix
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04  # هنستخدم نسخة أوبونتو مستقرة ومضمونة
    
    steps:
      - uses: actions/checkout@v4

      # 1. تجهيز بايثون (الأساس)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python_version: '3.10' 

      # 2. تسطيب الأدوات اللازمة للبناء (زي ما بتعمل pkg install)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools libltdl-dev zlib1g-dev libjpeg-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # 3. إنشاء ملف إعدادات جديد (عشان نضمن إن مفيش مسارات غلط من ترمكس)
      - name: Create Clean Spec
        run: |
          rm -f buildozer.spec
          buildozer init
          # تعديل الاسم والباكيدج
          sed -i 's/^title =.*/title = HeimaOS/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = heimaos/' buildozer.spec
          sed -i 's/^package.domain =.*/package.domain = org.heima/' buildozer.spec
          
          # المتطلبات (زودنا telethon و pillow)
          sed -i 's/^requirements =.*/requirements = python3,kivy==2.3.0,telethon,pillow/' buildozer.spec
          
          # تظبيط إصدارات الأندرويد عشان التحميل يكمل
          sed -i 's/^android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a/' buildozer.spec

      # 4. الأمر اللي بيبني التطبيق
      - name: Build APK
        run: |
          yes | buildozer -v android debug
        env:
          USER: runner

      # 5. رفع التطبيق لما يخلص
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeimaOS-APK
          path: bin/*.apk
